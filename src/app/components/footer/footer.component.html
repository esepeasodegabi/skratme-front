<footer class="border-t border-ink-950/[0.07] bg-white py-14">
  <div class="mx-auto max-w-6xl px-5 sm:px-8">
    <div class="grid grid-cols-2 gap-8 sm:grid-cols-3 lg:grid-cols-[1.4fr_repeat(4,1fr)]">
      <div class="col-span-2 sm:col-span-3 lg:col-span-1">
        <div class="flex items-center gap-2">
          <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-ink-950 text-brand-300">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
              <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
              <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
            </svg>
          </span>
          <span class="text-[17px] font-bold tracking-tight text-ink-950">Skratme</span>
        </div>
        <p class="mt-3 max-w-[220px] text-[13.5px] leading-relaxed text-ink-950/45">
          URLs cortas, QR dinámicos y experiencias digitales para tu negocio.
        </p>
      </div>

      @for (col of columns; track col.title) {
        <div>
          <h4 class="text-[12.5px] font-bold uppercase tracking-wide text-ink-950/40">{{ col.title }}</h4>
          <ul class="mt-3.5 space-y-2.5">
            @for (link of col.links; track link) {
              <li>
                <a class="cursor-pointer text-[13.5px] text-ink-950/60 transition hover:text-ink-950">{{ link }}</a>
              </li>
            }
          </ul>
        </div>
      }
    </div>

    <div class="mt-12 flex flex-col items-center justify-between gap-3 border-t border-ink-950/[0.06] pt-6 sm:flex-row">
      <p class="text-[12.5px] text-ink-950/35">© {{ year }} Skratme. Todos los derechos reservados.</p>
      <p class="text-[12.5px] text-ink-950/35">Hecho con 🩵 para que empieces gratis.</p>
    </div>
  </div>
</footer>
