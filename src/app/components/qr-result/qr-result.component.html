<div class="animate-scale-in mt-4 overflow-hidden rounded-3xl border border-ink-950/[0.07] bg-white shadow-card">
  <div class="flex flex-col gap-6 p-5 sm:flex-row sm:items-center sm:gap-8 sm:p-7">
    <!-- QR -->
    <div class="mx-auto shrink-0 rounded-2xl border border-ink-950/[0.06] bg-white p-3 shadow-soft sm:mx-0">
      @if (demo.qrDataUrl()) {
        <img [src]="demo.qrDataUrl()" alt="Código QR generado" class="h-40 w-40 rounded-lg sm:h-44 sm:w-44" />
      }
    </div>

    <!-- info -->
    <div class="min-w-0 flex-1">
      <div class="inline-flex items-center gap-1.5 rounded-full bg-mint-500/10 px-2.5 py-1 text-[12.5px] font-semibold text-mint-600">
        <span class="relative flex h-1.5 w-1.5">
          <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-mint-500 opacity-75"></span>
          <span class="relative inline-flex h-1.5 w-1.5 rounded-full bg-mint-500"></span>
        </span>
        Tu QR ya está funcionando
      </div>

      <p class="mt-3 truncate text-[13px] text-ink-950/40" [title]="demo.originalUrl()">
        {{ demo.originalUrl() }}
      </p>

      <div class="mt-1 flex items-center gap-2">
        <span class="truncate font-mono text-xl font-bold text-ink-950 sm:text-2xl">{{ demo.shortUrl() }}</span>
      </div>

      <div class="mt-4 flex flex-wrap gap-2">
        <button
          (click)="copyUrl()"
          class="flex items-center gap-1.5 rounded-lg border border-ink-950/[0.08] bg-white px-3.5 py-2 text-[13.5px] font-semibold text-ink-950 shadow-soft transition hover:bg-ink-950/[0.03] active:scale-[0.97]"
        >
          @if (copied()) {
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" class="text-mint-600"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Copiado
          } @else {
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M5 15V5a2 2 0 012-2h10" stroke="currentColor" stroke-width="1.8"/></svg>
            Copiar URL
          }
        </button>

        <button
          (click)="downloadQr()"
          class="flex items-center gap-1.5 rounded-lg border border-ink-950/[0.08] bg-white px-3.5 py-2 text-[13.5px] font-semibold text-ink-950 shadow-soft transition hover:bg-ink-950/[0.03] active:scale-[0.97]"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Descargar QR
        </button>

        <button
          (click)="share()"
          class="flex items-center gap-1.5 rounded-lg border border-ink-950/[0.08] bg-white px-3.5 py-2 text-[13.5px] font-semibold text-ink-950 shadow-soft transition hover:bg-ink-950/[0.03] active:scale-[0.97]"
        >
          @if (shared()) {
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" class="text-mint-600"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Enlace copiado
          } @else {
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="18" cy="5" r="2.5" stroke="currentColor" stroke-width="1.8"/><circle cx="6" cy="12" r="2.5" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="19" r="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M8.2 10.7l7.6-4.4M8.2 13.3l7.6 4.4" stroke="currentColor" stroke-width="1.8"/></svg>
            Compartir
          }
        </button>

        <button
          (click)="tryAnotherEvent.emit()"
          class="ml-auto flex items-center gap-1.5 rounded-lg px-3 py-2 text-[13.5px] font-semibold text-ink-950/45 transition hover:text-ink-950/80"
        >
          Probar otra URL
        </button>
      </div>
    </div>
  </div>
</div>
