<section id="faq" class="bg-white py-20 sm:py-28">
  <div class="mx-auto max-w-2xl px-5 sm:px-8">
    <h2 class="text-center text-3xl font-extrabold tracking-tight text-ink-950 sm:text-4xl">
      Preguntas frecuentes
    </h2>

    <div class="mt-10 divide-y divide-ink-950/[0.07] rounded-2xl border border-ink-950/[0.07] bg-white shadow-soft">
      @for (item of items; track item.question; let i = $index) {
        <div>
          <button
            type="button"
            (click)="toggle(i)"
            class="flex w-full items-center justify-between gap-4 px-5 py-4 text-left sm:px-6"
          >
            <span class="text-[15px] font-semibold text-ink-950">{{ item.question }}</span>
            <svg
              width="16" height="16" viewBox="0 0 24 24" fill="none"
              class="shrink-0 text-ink-950/40 transition-transform duration-200"
              [class.rotate-45]="openIndex() === i"
            >
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </button>
          @if (openIndex() === i) {
            <div class="animate-fade-up px-5 pb-4 text-[14.5px] leading-relaxed text-ink-950/60 sm:px-6">
              {{ item.answer }}
            </div>
          }
        </div>
      }
    </div>
  </div>
</section>
