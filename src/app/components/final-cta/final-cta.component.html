<section class="relative overflow-hidden bg-ink-950 py-20 sm:py-28">
  <div class="pointer-events-none absolute -top-32 left-1/2 h-[420px] w-[720px] -translate-x-1/2 rounded-full bg-brand-600/25 blur-3xl"></div>
  <div class="pointer-events-none absolute inset-0 bg-grid opacity-[0.06] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_40%,black,transparent)]"></div>

  <div class="relative mx-auto max-w-xl px-5 text-center sm:px-8">
    <h2 class="text-balance text-3xl font-extrabold tracking-tight text-white sm:text-4xl">
      Tu primer QR puede estar funcionando en menos de un minuto.
    </h2>

    <form (ngSubmit)="onSubmit()" class="mt-8 flex flex-col gap-3 sm:flex-row">
      <input
        type="text"
        name="url"
        [(ngModel)]="url"
        placeholder="Pega tu URL"
        class="h-14 w-full flex-1 rounded-xl border border-white/10 bg-white/[0.06] px-4 text-[15px] text-white placeholder-white/35 outline-none transition focus:border-brand-400/60 focus:bg-white/[0.09] focus:ring-4 focus:ring-brand-500/20"
        autocomplete="off"
      />
      <button
        type="submit"
        class="flex h-14 shrink-0 items-center justify-center gap-2 rounded-xl bg-gradient-to-b from-brand-500 to-brand-600 px-6 text-[15px] font-semibold text-white shadow-glow transition hover:brightness-110 active:scale-[0.98]"
      >
        Crear QR gratis
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>

    <p class="mt-5 text-[13.5px] font-medium text-white/40">
      Sin registro · Sin tarjeta · Empieza ahora
    </p>
  </div>
</section>
