<section class="bg-white py-16 sm:py-20">
  <div class="mx-auto max-w-5xl px-5 sm:px-8">
    <h2 class="text-center text-2xl font-extrabold tracking-tight text-ink-950 sm:text-3xl">
      Todo, de un vistazo
    </h2>
    <p class="mt-2 text-center text-[15px] text-ink-950/55">Entiéndelo en menos de 10 segundos.</p>

    <div class="mt-9 overflow-x-auto rounded-2xl border border-ink-950/[0.07] shadow-soft">
      <table class="w-full min-w-[640px] border-collapse text-left text-[13.5px]">
        <thead>
          <tr class="bg-ink-950/[0.03]">
            <th class="w-[26%] px-4 py-3.5 font-semibold text-ink-950/45">&nbsp;</th>
            @for (col of columns; track col; let i = $index) {
              <th class="px-4 py-3.5 font-bold text-ink-950" [class.text-brand-600]="i === 1" [class.text-amber-600]="i === 2" [class.text-mint-600]="i === 3">
                {{ col }}
              </th>
            }
          </tr>
        </thead>
        <tbody>
          @for (row of rows; track row.label; let last = $last) {
            <tr [class.border-b]="!last" class="border-ink-950/[0.06]">
              <td class="px-4 py-3.5 font-medium text-ink-950/55">{{ row.label }}</td>
              @for (val of row.values; track $index) {
                <td class="px-4 py-3.5 font-semibold text-ink-950/85">
                  @if (val === '—') {
                    <span class="text-ink-950/25">—</span>
                  } @else {
                    {{ val }}
                  }
                </td>
              }
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</section>
