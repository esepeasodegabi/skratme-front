<header class="sticky top-0 z-50 border-b border-ink-950/[0.06] bg-white/75 backdrop-blur-lg">
  <nav class="mx-auto flex max-w-6xl items-center justify-between px-5 py-3.5 sm:px-8">
    <a
      (click)="scrollTo('top')"
      class="flex cursor-pointer items-center gap-2 select-none"
    >
      <span
        class="flex h-8 w-8 items-center justify-center rounded-lg bg-ink-950 text-brand-300"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
          <rect x="14.5" y="14.5" width="2.5" height="2.5" fill="currentColor"/>
          <rect x="18.5" y="14.5" width="2.5" height="2.5" fill="currentColor"/>
          <rect x="14.5" y="18.5" width="2.5" height="2.5" fill="currentColor"/>
          <rect x="18.5" y="18.5" width="2.5" height="2.5" fill="currentColor"/>
        </svg>
      </span>
      <span class="text-[17px] font-bold tracking-tight text-ink-950">Skratme</span>
    </a>

    <div class="hidden items-center gap-7 text-[14.5px] font-medium text-ink-950/70 md:flex">
      <a (click)="scrollTo('pricing')" class="cursor-pointer transition hover:text-ink-950">Precios</a>
      <a (click)="scrollTo('how-it-works')" class="cursor-pointer transition hover:text-ink-950">Cómo funciona</a>
      <a (click)="scrollTo('verticals')" class="cursor-pointer transition hover:text-ink-950">Soluciones</a>
      <a (click)="scrollTo('analytics')" class="cursor-pointer transition hover:text-ink-950">Estadísticas</a>
      <a (click)="scrollTo('faq')" class="cursor-pointer transition hover:text-ink-950">FAQ</a>
    </div>

    <div class="hidden items-center gap-3 md:flex">
      <button
        (click)="scrollTo('pricing')"
        class="text-[14.5px] font-semibold text-ink-950/80 transition hover:text-ink-950"
      >
        Iniciar sesión
      </button>
      <button
        (click)="scrollTo('top')"
        class="rounded-full bg-ink-950 px-4 py-2 text-[14.5px] font-semibold text-white shadow-soft transition hover:bg-ink-800 active:scale-[0.97]"
      >
        Crear mi QR
      </button>
    </div>

    <button
      (click)="toggleMobile()"
      class="flex h-9 w-9 items-center justify-center rounded-lg text-ink-950 md:hidden"
      aria-label="Abrir menú"
    >
      @if (!mobileOpen()) {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      } @else {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      }
    </button>
  </nav>

  @if (mobileOpen()) {
    <div class="border-t border-ink-950/[0.06] bg-white px-5 py-4 md:hidden animate-fade-up">
      <div class="flex flex-col gap-1 text-[15px] font-medium text-ink-950/80">
        <a (click)="scrollTo('pricing')" class="cursor-pointer rounded-lg px-2 py-2.5 hover:bg-ink-950/[0.04]">Precios</a>
        <a (click)="scrollTo('how-it-works')" class="cursor-pointer rounded-lg px-2 py-2.5 hover:bg-ink-950/[0.04]">Cómo funciona</a>
        <a (click)="scrollTo('verticals')" class="cursor-pointer rounded-lg px-2 py-2.5 hover:bg-ink-950/[0.04]">Soluciones</a>
        <a (click)="scrollTo('analytics')" class="cursor-pointer rounded-lg px-2 py-2.5 hover:bg-ink-950/[0.04]">Estadísticas</a>
        <a (click)="scrollTo('faq')" class="cursor-pointer rounded-lg px-2 py-2.5 hover:bg-ink-950/[0.04]">FAQ</a>
        <button
          (click)="scrollTo('top')"
          class="mt-2 rounded-full bg-ink-950 px-4 py-2.5 text-center font-semibold text-white"
        >
          Crear mi QR
        </button>
      </div>
    </div>
  }
</header>
