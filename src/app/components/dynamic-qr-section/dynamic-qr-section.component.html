<section class="bg-white py-20 sm:py-28">
  <div class="mx-auto max-w-5xl px-5 sm:px-8">
    <div class="grid grid-cols-1 items-center gap-12 lg:grid-cols-2">
      <div>
        <h2 class="text-balance text-3xl font-extrabold tracking-tight text-ink-950 sm:text-4xl">
          Cambia el destino.
          <br />
          No cambies el QR.
        </h2>
        <p class="mt-4 text-[16px] leading-relaxed text-ink-950/55">
          El código impreso sigue siendo exactamente el mismo. Lo único que cambia es a dónde apunta.
          Imprime una vez, actualiza siempre.
        </p>

        <ul class="mt-6 grid grid-cols-1 gap-2.5 sm:grid-cols-2">
          @for (ex of examples; track ex) {
            <li class="flex items-center gap-2 rounded-xl border border-ink-950/[0.07] bg-white px-3.5 py-2.5 text-[13.5px] font-medium text-ink-950/70 shadow-soft">
              <svg class="shrink-0 text-brand-500" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
              {{ ex }}
            </li>
          }
        </ul>
      </div>

      <!-- visual: same QR, two destinations -->
      <div class="relative mx-auto w-full max-w-sm">
        <div class="rounded-3xl border border-ink-950/[0.07] bg-white p-6 shadow-card">
          <div class="flex flex-col items-center">
            <div class="flex h-32 w-32 items-center justify-center rounded-2xl bg-ink-950/[0.04]">
              <svg width="72" height="72" viewBox="0 0 24 24" fill="none" class="text-ink-950/70">
                <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/>
                <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/>
                <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/>
                <rect x="15" y="15" width="2" height="2" fill="currentColor"/>
                <rect x="19" y="15" width="2" height="2" fill="currentColor"/>
                <rect x="15" y="19" width="2" height="2" fill="currentColor"/>
                <rect x="19" y="19" width="2" height="2" fill="currentColor"/>
              </svg>
            </div>
            <span class="mt-2.5 font-mono text-[12.5px] font-semibold text-ink-950/50">skrat.me/x7kd2</span>
          </div>

          <div class="my-5 flex items-center gap-2 text-ink-950/25">
            <div class="h-px flex-1 bg-ink-950/10"></div>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12l7 7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div class="h-px flex-1 bg-ink-950/10"></div>
          </div>

          <div class="space-y-2.5">
            <div class="flex items-center justify-between rounded-xl border border-ink-950/[0.06] bg-ink-950/[0.02] px-3.5 py-2.5">
              <span class="text-[11.5px] font-bold uppercase tracking-wide text-ink-950/35">Hoy</span>
              <span class="font-mono text-[13px] text-ink-950/70">carta-verano.pdf</span>
            </div>
            <div class="flex items-center justify-between rounded-xl border border-brand-500/20 bg-brand-500/[0.06] px-3.5 py-2.5">
              <span class="text-[11.5px] font-bold uppercase tracking-wide text-brand-600">Mañana</span>
              <span class="font-mono text-[13px] font-semibold text-brand-700">carta-invierno.pdf</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
